[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentreplay-lab"
version = "0.1.0"
description = "Reproducible failure scenarios for tool-using agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "pedronavarro-labs"}]
keywords = ["agents", "mcp", "testing", "fault-injection"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]
dependencies = []

[project.scripts]
agentreplay = "agentreplay.cli:main"

[tool.setuptools.packages.find]
include = ["agentreplay*"]
